name: Build Windows Installer (setup.exe)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fix: Remove Linux-only pnpm overrides that block Windows native modules.
      # pnpm-workspace.yaml has overrides like "rollup>@rollup/rollup-win32-x64-msvc": "-"
      # that exclude Windows packages for Replit's Linux env. On Windows runner they must be removed.
      - name: Fix pnpm-workspace.yaml for Windows build
        shell: pwsh
        run: |
          $content = Get-Content 'pnpm-workspace.yaml' -Raw
          $lines = $content -split "`n"
          $filtered = $lines | Where-Object {
            -not ($_ -match 'win32' -and $_ -match '"-"') -and
            -not ($_ -match 'msvc'  -and $_ -match '"-"')
          }
          $filtered -join "`n" | Set-Content 'pnpm-workspace.yaml'
          Write-Host "Cleaned win32/msvc overrides from pnpm-workspace.yaml"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false --ignore-scripts=false

      - name: Build Vite (Electron config — no PORT/BASE_PATH required)
        working-directory: artifacts/tradermind
        run: pnpm run electron:build:vite

      - name: Compile Electron TypeScript
        working-directory: artifacts/tradermind
        run: pnpm run electron:compile

      # --publish never: we upload manually via actions/upload-artifact below
      # repository field in package.json satisfies electron-builder's publish detection
      - name: Build Windows installer (electron-builder)
        working-directory: artifacts/tradermind
        run: pnpm exec electron-builder --win --x64 --config electron-builder.json --publish never

      - name: List output files
        shell: bash
        working-directory: artifacts/tradermind
        run: |
          echo "=== dist-electron contents ==="
          find dist-electron -type f | sort

      - name: Upload setup.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraderOS-Windows-Setup
          path: artifacts/tradermind/dist-electron/*.exe
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/tradermind/dist-electron/*.exe
          name: "Trader OS ${{ github.ref_name }}"
          body: |
            ## Trader OS — Advanced Trading Operating System

            ### نصب روی ویندوز ۱۱ (۶۴ بیت)
            فایل `TraderOS-Setup-*.exe` را دانلود و اجرا کنید.

            **ویژگی‌ها:**
            - ژورنال معاملاتی کامل — ثبت، آنالیز، مرور
            - مدیریت ریسک و روانشناسی معاملاتی
            - کاملاً آفلاین (بدون نیاز به اینترنت)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
