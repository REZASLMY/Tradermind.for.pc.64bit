name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile=false

      # Build web app using electron vite config (base="./" works for Capacitor local webview)
      - name: Build web app (Electron/Capacitor config)
        working-directory: artifacts/tradermind
        run: pnpm run electron:build:vite

      # Install Capacitor CLI and Android platform globally for this build
      - name: Install Capacitor
        working-directory: artifacts/tradermind
        run: |
          npm install --save-dev @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/splash-screen@latest

      # Initialize Capacitor and add Android platform
      - name: Initialize Capacitor Android
        working-directory: artifacts/tradermind
        run: |
          npx cap add android 2>/dev/null || echo "Android platform may already exist"
          npx cap sync android

      # Update Android app name and icon
      - name: Update Android app resources
        working-directory: artifacts/tradermind
        run: |
          # Update app_name in strings.xml
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Trader OS<\/string>/' "$STRINGS_FILE"
          fi
          
          # Copy icon to Android mipmap folders
          ICON_SRC="public/icon.png"
          for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DIR="android/app/src/main/res/mipmap-${size}"
            mkdir -p "$DIR"
            if [ -f "$ICON_SRC" ]; then
              cp "$ICON_SRC" "${DIR}/ic_launcher.png"
              cp "$ICON_SRC" "${DIR}/ic_launcher_round.png"
              cp "$ICON_SRC" "${DIR}/ic_launcher_foreground.png"
            fi
          done
          echo "Android resources updated"

      # Make Gradle wrapper executable
      - name: Make gradlew executable
        working-directory: artifacts/tradermind/android
        run: chmod +x gradlew

      # Cache Gradle dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/tradermind/android/**/*.gradle*', 'artifacts/tradermind/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Build Debug APK (no signing required)
      - name: Build Debug APK
        working-directory: artifacts/tradermind/android
        run: ./gradlew assembleDebug --no-daemon

      # Build Release APK (unsigned)
      - name: Build Release APK (unsigned)
        working-directory: artifacts/tradermind/android
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: List APK output files
        run: |
          echo "=== APK files ==="
          find artifacts/tradermind/android -name "*.apk" | sort

      - name: Rename APKs
        run: |
          mkdir -p apk-output
          find artifacts/tradermind/android -name "*.apk" -exec cp {} apk-output/ \;
          ls -la apk-output/
          # Rename to friendly names
          for f in apk-output/*.apk; do
            mv "$f" "${f%.apk}-TraderOS.apk" 2>/dev/null || true
          done
          ls -la apk-output/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraderOS-Android-APK
          path: apk-output/*.apk
          retention-days: 30

      - name: Create GitHub Release (Android)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          name: "Trader OS ${{ github.ref_name }}"
          body: |
            ## Trader OS — نسخه اندروید
            
            ### نصب روی اندروید
            فایل `app-debug-TraderOS.apk` را دانلود کنید.
            
            > **نکته:** قبل از نصب، در تنظیمات گوشی گزینه «نصب از منابع ناشناخته» را فعال کنید.
            
            **ویژگی‌ها:**
            - ژورنال معاملاتی کامل
            - آنالیز عملکرد
            - مدیریت ریسک
            - بدون نیاز به اینترنت (آفلاین)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
