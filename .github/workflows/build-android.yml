name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # pnpm install handles @capacitor/* packages from package.json (no catalog: references there)
      - name: Install dependencies (includes Capacitor)
        run: pnpm install --frozen-lockfile=false

      # Build web app using electron/capacitor vite config (base="./" — works for local webview)
      - name: Build web app (Electron/Capacitor config)
        working-directory: artifacts/tradermind
        run: pnpm run electron:build:vite

      # Add Android platform via Capacitor (uses pnpm exec — no npm, no catalog: issues)
      - name: Initialize Capacitor Android platform
        working-directory: artifacts/tradermind
        run: |
          # Only run "cap add android" if the android/ folder doesn't exist yet.
          # In CI the folder is gitignored so it never exists; this guard is for safety.
          if [ ! -d "android" ]; then
            echo "Running cap add android..."
            pnpm exec cap add android
          else
            echo "Android platform already exists, skipping cap add"
          fi
          pnpm exec cap sync android
          echo "Capacitor sync complete"

      # Update Android app name
      - name: Update Android app name
        working-directory: artifacts/tradermind
        run: |
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Trader OS<\/string>/' "$STRINGS_FILE"
            echo "Updated app name in strings.xml"
          fi

      # Copy Trader OS icon to all Android mipmap densities
      - name: Set Trader OS icon for Android
        working-directory: artifacts/tradermind
        run: |
          ICON_SRC="public/icon.png"
          if [ -f "$ICON_SRC" ]; then
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              DIR="android/app/src/main/res/mipmap-${density}"
              mkdir -p "$DIR"
              cp "$ICON_SRC" "${DIR}/ic_launcher.png"
              cp "$ICON_SRC" "${DIR}/ic_launcher_round.png"
            done
            echo "Icon copied to all mipmap folders"
          else
            echo "WARNING: icon.png not found at $ICON_SRC"
          fi

      - name: Make Gradle wrapper executable
        working-directory: artifacts/tradermind/android
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/tradermind/android/**/*.gradle*', 'artifacts/tradermind/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: artifacts/tradermind/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        working-directory: artifacts/tradermind/android
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: Collect and rename APKs
        run: |
          mkdir -p apk-output
          find artifacts/tradermind/android -name "*.apk" | while read f; do
            base=$(basename "$f" .apk)
            cp "$f" "apk-output/TraderOS-${base}.apk"
          done
          echo "=== APK files ==="
          ls -lh apk-output/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraderOS-Android-APK
          path: apk-output/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          name: "Trader OS ${{ github.ref_name }}"
          body: |
            ## Trader OS — نسخه اندروید

            ### نصب روی اندروید
            فایل `TraderOS-app-debug.apk` را دانلود کنید.

            > **نکته:** قبل از نصب، در تنظیمات گوشی گزینه «نصب از منابع ناشناخته» را فعال کنید.
            > Settings → Security → Install unknown apps

            **ویژگی‌ها:**
            - ژورنال معاملاتی کامل
            - مدیریت ریسک
            - کاملاً آفلاین
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
